# StarterApp geliştirme ortamı (repo kökünden çalıştırılır).
#   docker compose --profile app up -d  → server + client → http://localhost:4200
#                                         Veritabanı ve admin bilgileri server/.env'den gelir (DB_URL, ADMIN_EMAIL...).
#   docker compose --profile db up -d   → sadece yerel PostgreSQL 18 (localhost:5433); .env'deki DB_URL buna çevrilirse kullanılır
services:
  postgres:
    profiles: ["db"]
    image: postgres:18
    environment:
      POSTGRES_DB: starterapp
      POSTGRES_USER: starterapp
      POSTGRES_PASSWORD: starterapp
    ports:
      # Yerelde kurulu bir PostgreSQL 5432'yi kullanıyorsa çakışmasın diye 5433.
      - "5433:5432"
    volumes:
      # PostgreSQL 18 ile volume yolu değişti: /var/lib/postgresql/data değil /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starterapp -d starterapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ["app"]
    build: ./server
    # DB_URL, DB_USERNAME, DB_PASSWORD, DB_SCHEMA, ADMIN_EMAIL, ADMIN_PASSWORD: IDE'den çalıştırmayla aynı dosya.
    # (.env imaja girmez; .dockerignore'da.)
    env_file: ./server/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      # Client aynı adresten (nginx) geldiği için CORS gerekmez; gerçek istemci IP'si nginx'in X-Forwarded-For'undan.
      CORS_ALLOWED_ORIGINS: ""
      FORWARD_HEADERS_STRATEGY: native
    volumes:
      - ./server/keys:/app/keys:ro
    ports:
      # Swagger ve doğrudan API denemeleri için; tarayıcı uygulaması API'ye client üzerinden ulaşır.
      - "8080:8080"

  client:
    profiles: ["app"]
    build: ./client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  pgdata:
