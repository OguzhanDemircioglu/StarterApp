# Geliştirme ortamı. Değerler server/.env dosyasından ya da environment variable'dan gelir.
spring:
  config:
    # .env sadece dev profilinde okunur: testler ve prod gerçek DB bilgilerini yanlışlıkla kullanamaz.
    # Ortam değişkenleri her zaman .env'den önceliklidir. (.env git'e girmez.)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/starterapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    key-id: ${JWT_KEY_ID:dev-key}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
  session:
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:admin@starterapp.local}
    password: ${ADMIN_PASSWORD:Admin12345}
