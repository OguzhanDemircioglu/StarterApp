# KAPALI AĞ sunucusu: yönetim paneli (ADMIN, SUPERADMIN) + veritabanı.
# İnternete açılmaz. Ayrıntı: deploy/README.md
#
#   cd deploy/internal
#   cp .env.example .env        # değerleri doldurun
#   docker compose up -d --build
#
# Veritabanı bu sunucudadır. Dışarıya açık sunucu (deploy/public) veritabanına sadece güvenlik duvarında açılan
# tek bir izinle (public sunucunun IP'si → bu sunucunun 5432 portu) bağlanır; DB_BIND_ADDRESS buna göre verilir.
name: mezunkart-internal

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mezunkart}
      POSTGRES_USER: ${DB_USERNAME:-mezunkart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    ports:
      # Varsayılan 127.0.0.1: sadece bu makine. Public sunucu bağlanacaksa kapalı ağdaki arayüzün IP'si verilir
      # ve güvenlik duvarında sadece public sunucunun IP'sine izin verilir.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mezunkart} -d ${DB_NAME:-mezunkart}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  server:
    build: ../../server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_SURFACE: internal
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mezunkart}
      DB_USERNAME: ${DB_USERNAME:-mezunkart}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      DB_SCHEMA: ${DB_SCHEMA:-mezunkart}
      # İlk açılışta sistemde yönetici yoksa oluşturulur ve SUPERADMIN olur.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL gerekli}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli}
      # Bu yüzeyin kendi anahtar çifti (public sunucununkinden farklı olmalı).
      JWT_KEY_ID: ${JWT_KEY_ID:-internal-key-1}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      CORS_ALLOWED_ORIGINS: ""
      # Kapalı ağda TLS yoksa false; iç sertifika varsa true bırakın.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARD_HEADERS_STRATEGY: native
    secrets:
      - jwt_private_key
      - jwt_public_key
    logging: *logging

  client:
    build:
      context: ../../client
      args:
        SURFACE: internal
    restart: unless-stopped
    environment:
      API_UPSTREAM: server:8080
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Kapalı ağdaki kullanıcıların erişeceği adres. TLS'i önündeki iç reverse proxy yapıyorsa 127.0.0.1 bırakın.
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    logging: *logging

secrets:
  jwt_private_key:
    file: ./keys/private.pem
  jwt_public_key:
    file: ./keys/public.pem

volumes:
  pgdata:
