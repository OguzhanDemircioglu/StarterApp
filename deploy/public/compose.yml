# DIŞARIYA AÇIK sunucu (DMZ): public tanıtım sayfası + Mezun Portalı (USER).
# Bu sunucuda yönetim panelinin kodu yoktur; server APP_SURFACE=public ile yönetim girişini ve /api/admin/**'ı reddeder.
# Ayrıntı: deploy/README.md
#
#   cd deploy/public
#   cp .env.example .env        # değerleri doldurun
#   docker compose up -d --build
#
# Veritabanı kapalı ağdaki sunucudadır (deploy/internal); DB_URL oraya, güvenlik duvarında açılan izinle bağlanır.
# Önce internal kurulur: şema ve migration'lar orada çalışır, public sonra açılır.
name: mezunkart-public

services:
  server:
    build: ../../server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_SURFACE: public
      DB_URL: ${DB_URL:?DB_URL gerekli (kapalı ağdaki veritabanı)}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME gerekli}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      DB_SCHEMA: ${DB_SCHEMA:-mezunkart}
      # Bu yüzeyin kendi anahtar çifti (internal sunucununkinden farklı olmalı).
      JWT_KEY_ID: ${JWT_KEY_ID:-public-key-1}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      CORS_ALLOWED_ORIGINS: ""
      COOKIE_SECURE: "true"
      FORWARD_HEADERS_STRATEGY: native
    secrets:
      - jwt_private_key
      - jwt_public_key
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  client:
    build:
      context: ../../client
      args:
        SURFACE: public
    restart: unless-stopped
    environment:
      API_UPSTREAM: server:8080
    depends_on:
      server:
        condition: service_healthy
    ports:
      # TLS'i önündeki reverse proxy (ör. sunucudaki nginx/Caddy, ya da kurumun yük dengeleyicisi) yapar;
      # container sadece o proxy'nin ulaşabileceği adreste dinler.
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    logging: *logging

secrets:
  jwt_private_key:
    file: ./keys/private.pem
  jwt_public_key:
    file: ./keys/public.pem
