# Angular dosyalarını sunar ve /api isteklerini server container'ına iletir.
# Tarayıcı frontend ile backend'i aynı adreste görür: CORS gerekmez, SameSite=Strict refresh cookie'si sorunsuz çalışır.

# Önde HTTPS yapan bir reverse proxy varsa onun gönderdiği protokol (https) korunur; yoksa bu bağlantınınki kullanılır.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        # Gerçek istemci IP'si: brute-force koruması IP_email anahtarını kullanır (server: FORWARD_HEADERS_STRATEGY=native).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Uygulama ve çeviri dosyaları her zaman güncel gelsin.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    # Build çıktısındaki JS/CSS dosyalarının adında içerik hash'i var; uzun süre önbelleğe alınabilir.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: bilinmeyen her yol index.html'e düşer (ör. /definitions/categories sayfasında F5).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
