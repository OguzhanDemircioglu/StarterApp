<nz-layout class="shell">
  <nz-sider
    class="sider"
    nzCollapsible
    nzBreakpoint="lg"
    nzWidth="248px"
    [nzCollapsedWidth]="64"
    [nzTrigger]="null"
    [(nzCollapsed)]="collapsed"
  >
    <a class="brand" routerLink="/admin">
      <app-brand-logo [light]="true" [compact]="collapsed()" />
    </a>
    @if (!collapsed()) {
      <div class="sider-title">
        <span>YÖNETİM PANELİ</span>
        <strong>Mezun Kart</strong>
      </div>
    }
    <app-sidebar-menu [collapsed]="collapsed()" />
  </nz-sider>

  <nz-layout>
    <nz-header class="header">
      <app-topbar [collapsed]="collapsed()" (toggleSidebar)="collapsed.set(!collapsed())" />
    </nz-header>
    <nz-content class="content">
      <app-banner />
      <router-outlet />
    </nz-content>
  </nz-layout>
</nz-layout>
