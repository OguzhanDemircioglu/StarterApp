<div class="topbar">
  <button
    nz-button
    nzType="text"
    [attr.aria-label]="'layout_toggle_menu' | translate"
    (click)="toggleSidebar.emit()"
  >
    <nz-icon [nzType]="collapsed() ? 'menu-unfold' : 'menu-fold'" />
  </button>

  <div class="actions">
    <button nz-button nzType="text" nz-dropdown [nzDropdownMenu]="languageMenu">
      <nz-icon nzType="global" />
      {{ (language() === 'en' ? 'lang_en' : 'lang_tr') | translate }}
    </button>
    <nz-dropdown-menu #languageMenu="nzDropdownMenu">
      <ul nz-menu>
        <li nz-menu-item (click)="useLanguage('tr')">{{ 'lang_tr' | translate }}</li>
        <li nz-menu-item (click)="useLanguage('en')">{{ 'lang_en' | translate }}</li>
      </ul>
    </nz-dropdown-menu>

    @if (user(); as user) {
      <button nz-button nzType="text" nz-dropdown [nzDropdownMenu]="userMenu" nzTrigger="click">
        <nz-icon nzType="user" />
        {{ user.fullName }}
        <nz-tag [nzColor]="user.role === 'ADMIN' ? 'gold' : 'blue'">
          {{ (user.role === 'ADMIN' ? 'role_admin' : 'role_user') | translate }}
        </nz-tag>
      </button>
      <nz-dropdown-menu #userMenu="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item (click)="changePasswordOpen.set(true)">
            <nz-icon nzType="key" /> {{ 'layout_change_password' | translate }}
          </li>
          <li nz-menu-divider></li>
          <li nz-menu-item (click)="logout()">
            <nz-icon nzType="logout" /> {{ 'layout_logout' | translate }}
          </li>
        </ul>
      </nz-dropdown-menu>
    }
  </div>
</div>

<app-change-password [(open)]="changePasswordOpen" />
