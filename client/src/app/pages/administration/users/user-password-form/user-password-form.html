<nz-modal
  [nzVisible]="open()"
  [nzTitle]="'user_reset_password_title' | translate: { email: user()?.email }"
  [nzOkText]="'common_save' | translate"
  [nzCancelText]="'common_cancel' | translate"
  [nzOkLoading]="saving()"
  (nzOnOk)="save()"
  (nzOnCancel)="open.set(false)"
>
  <ng-container *nzModalContent>
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="save()">
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'user_new_password' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="passwordErrors">
          <input nz-input type="password" formControlName="newPassword" autocomplete="new-password" />
        </nz-form-control>
        <ng-template #passwordErrors let-control>
          @if (control.errors?.['required']) { {{ 'user_password_required' | translate }} }
          @if (control.errors?.['minlength']) { {{ 'user_password_too_short' | translate }} }
          @if (control.errors?.['maxBytes']) { {{ 'user_password_too_long' | translate }} }
        </ng-template>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
