<div class="login">
  <nz-card class="login-card">
    <h1 class="title">{{ 'app_name' | translate }}</h1>
    <p class="subtitle">{{ 'login_subtitle' | translate }}</p>

    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'login_email' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="emailErrors">
          <nz-input-group nzPrefixIcon="mail">
            <input nz-input type="email" formControlName="email" autocomplete="username" />
          </nz-input-group>
        </nz-form-control>
        <ng-template #emailErrors let-control>
          @if (control.errors?.['required']) { {{ 'auth_email_required' | translate }} }
          @if (control.errors?.['email']) { {{ 'user_email_invalid' | translate }} }
        </ng-template>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>{{ 'login_password' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'auth_password_required' | translate">
          <nz-input-group nzPrefixIcon="lock">
            <input nz-input type="password" formControlName="password" autocomplete="current-password" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="pending()">
        {{ 'login_submit' | translate }}
      </button>
    </form>

    <div class="languages">
      <button nz-button nzType="link" nzSize="small" [disabled]="language() === 'tr'" (click)="useLanguage('tr')">
        {{ 'lang_tr' | translate }}
      </button>
      <button nz-button nzType="link" nzSize="small" [disabled]="language() === 'en'" (click)="useLanguage('en')">
        {{ 'lang_en' | translate }}
      </button>
    </div>
  </nz-card>
</div>
