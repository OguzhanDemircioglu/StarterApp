<div class="login">
  <div class="wrapper">
    <span class="rotate-bg"></span>

    <div class="form-box">
      <h1 class="title animation" style="--i: 0">{{ 'app_name' | translate }}</h1>

      <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
        <nz-form-item class="animation" style="--i: 1">
          <nz-form-control [nzErrorTip]="emailErrors">
            <div class="input-box">
              <input id="login-email" type="email" placeholder=" " formControlName="email" autocomplete="username" />
              <label for="login-email">{{ 'login_email' | translate }}</label>
              <nz-icon nzType="mail" />
            </div>
          </nz-form-control>
          <ng-template #emailErrors let-control>
            @if (control.errors?.['required']) { {{ 'auth_email_required' | translate }} }
            @if (control.errors?.['email']) { {{ 'user_email_invalid' | translate }} }
          </ng-template>
        </nz-form-item>

        <nz-form-item class="animation" style="--i: 2">
          <nz-form-control [nzErrorTip]="'auth_password_required' | translate">
            <div class="input-box">
              <input
                id="login-password"
                type="password"
                placeholder=" "
                formControlName="password"
                autocomplete="current-password"
              />
              <label for="login-password">{{ 'login_password' | translate }}</label>
              <nz-icon nzType="lock" />
            </div>
          </nz-form-control>
        </nz-form-item>

        <button
          class="submit animation"
          style="--i: 3"
          nz-button
          nzType="primary"
          nzShape="round"
          nzBlock
          type="submit"
          [nzLoading]="pending()"
        >
          {{ 'login_submit' | translate }}
        </button>
      </form>

      <div class="languages animation" style="--i: 4">
        <button nz-button nzType="link" nzSize="small" [disabled]="language() === 'tr'" (click)="useLanguage('tr')">
          {{ 'lang_tr' | translate }}
        </button>
        <button nz-button nzType="link" nzSize="small" [disabled]="language() === 'en'" (click)="useLanguage('en')">
          {{ 'lang_en' | translate }}
        </button>
      </div>
    </div>

    <div class="info-text">
      <h2 class="animation" style="--i: 1">{{ 'login_welcome' | translate }}</h2>
      <p class="animation" style="--i: 2">{{ 'login_subtitle' | translate }}</p>
    </div>
  </div>
</div>
