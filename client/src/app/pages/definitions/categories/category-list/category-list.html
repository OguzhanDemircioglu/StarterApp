<app-page>
  <app-section title="category_list_title">
    <div sectionActions class="section-actions">
      <nz-input-group nzPrefixIcon="search">
        <input
          nz-input
          [placeholder]="'common_search' | translate"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
        />
      </nz-input-group>
      <button nz-button nz-tooltip [nzTooltipTitle]="'common_reload' | translate" (click)="load()">
        <nz-icon nzType="reload" />
      </button>
      <button nz-button nzType="primary" (click)="openCreate()">
        <nz-icon nzType="plus" /> {{ 'common_add' | translate }}
      </button>
    </div>

    <nz-table #table [nzData]="filtered()" [nzLoading]="loading()" [nzPageSize]="20" nzSize="middle">
      <thead>
        <tr>
          <th [nzSortFn]="sortByName">{{ 'category_name' | translate }}</th>
          <th>{{ 'category_description' | translate }}</th>
          <th [nzSortFn]="sortByCreatedAt" nzWidth="180px">{{ 'common_created_at' | translate }}</th>
          <th nzWidth="120px" nzAlign="right">{{ 'common_actions' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        @for (category of table.data; track category.id) {
          <tr>
            <td>{{ category.name }}</td>
            <td>{{ category.description }}</td>
            <td>{{ category.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
            <td nzAlign="right">
              <button nz-button nzType="text" nz-tooltip [nzTooltipTitle]="'common_edit' | translate" (click)="openEdit(category)">
                <nz-icon nzType="edit" />
              </button>
              <button
                nz-button
                nzType="text"
                nzDanger
                nz-popconfirm
                [nzPopconfirmTitle]="'category_delete_confirm' | translate"
                [nzOkText]="'common_delete' | translate"
                [nzCancelText]="'common_cancel' | translate"
                (nzOnConfirm)="remove(category)"
              >
                <nz-icon nzType="delete" />
              </button>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
  </app-section>
</app-page>

<app-category-form [(open)]="formOpen" [category]="editing()" (saved)="load()" />
